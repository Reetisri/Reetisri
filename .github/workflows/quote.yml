name: Daily Developer Quote

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Quote Updater Script
        shell: python
        run: |
          import random
          import re

          quotes = [
              ("Programs must be written for people to read, and only secondarily for machines to execute.", "Harold Abelson"),
              ("Any fool can write code that a computer can understand. Good programmers write code that humans can understand.", "Martin Fowler"),
              ("First, solve the problem. Then, write the code.", "John Johnson"),
              ("Experience is the name everyone gives to their mistakes.", "Oscar Wilde"),
              ("In order to be irreplaceable one must always be different.", "Coco Chanel"),
              ("Java is to JavaScript what car is to Carpet.", "Chris Heilmann"),
              ("Knowledge is power.", "Francis Bacon"),
              ("Sometimes it pays to stay in bed on Monday, rather than spending the rest of the week debugging Monday's code.", "Dan Salomon"),
              ("Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away.", "Antoine de Saint-Exupéry"),
              ("Ruby is rubbish. PHP is pathology. Python is pertness. Java is job security.", "Unknown"),
              ("Code is like humor. When you have to explain it, it’s bad.", "Cory House"),
              ("Fix the cause, not the symptom.", "Steve Maguire"),
              ("Optimism is an occupational hazard of programming: feedback is the treatment.", "Kent Beck"),
              ("Simplicity is the soul of efficiency.", "Austin Freeman"),
              ("Before software can be reusable it first has to be usable.", "Ralph Johnson"),
              ("There are only two hard things in Computer Science: cache invalidation and naming things.", "Phil Karlton"),
              ("Software is a great combination between artistry and engineering.", "Bill Gates"),
              ("Strive for simplicity, but avoid simplistic solutions.", "Alan Perlis"),
              ("Make it work, make it right, make it fast.", "Kent Beck"),
              ("The best way to predict the future is to invent it.", "Alan Kay")
          ]

          quote, author = random.choice(quotes)
          quote_html = f'<blockquote align="center"><b>"{quote}"</b><br/>— <i>{author}</i></blockquote>'

          with open('README.md', 'r', encoding='utf-8') as file:
              readme = file.read()

          # Replace content between placeholders
          pattern = r'(<!--START_SECTION:quote-->)(.*?)(<!--END_SECTION:quote-->)'
          updated_readme = re.sub(pattern, f'\\1\n{quote_html}\n\\3', readme, flags=re.DOTALL)

          with open('README.md', 'w', encoding='utf-8') as file:
              file.write(updated_readme)

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git commit -am "docs(quote): update daily developer quote [skip ci]" && git push)
