<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="50%" stop-color="#FF4D94" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="purpleCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="pinkCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D94" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&amp;family=Fira+Code:wght@400;700&amp;display=swap');
    
    .bg { fill: #0d0f1b; }
    .grid-line { stroke: rgba(108, 99, 255, 0.08); stroke-width: 1; }
    .grid-line-accent { stroke: rgba(0, 229, 255, 0.15); stroke-width: 1.5; }
    .title {
      font-family: 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: url(#cyberGradient);
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      fill: #a0aec0;
      letter-spacing: 2px;
    }
    .tag {
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #00E5FF;
      letter-spacing: 1px;
    }
    .bracket {
      font-family: 'Fira Code', monospace;
      font-size: 60px;
      font-weight: 700;
      fill: rgba(255, 77, 148, 0.15);
    }
    
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    
    .pulse-dot {
      animation: pulse 3s infinite ease-in-out;
    }
    
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dash 5s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="15"/>
  
  <!-- Cyber Grid -->
  <g>
    <!-- Horizontal grid lines -->
    <line x1="0" y1="50" x2="800" y2="50" class="grid-line" />
    <line x1="0" y1="100" x2="800" y2="100" class="grid-line" />
    <line x1="0" y1="150" x2="800" y2="150" class="grid-line" />
    <line x1="0" y1="200" x2="800" y2="200" class="grid-line" />
    
    <!-- Vertical grid lines -->
    <line x1="100" y1="0" x2="100" y2="250" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="250" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="250" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="250" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="250" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="250" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="250" class="grid-line" />
  </g>

  <!-- Accent Lines/Borders -->
  <rect x="15" y="15" width="770" height="220" fill="none" stroke="url(#purpleCyan)" stroke-width="1.5" stroke-opacity="0.3" rx="10"/>
  <rect x="25" y="25" width="750" height="200" fill="none" stroke="url(#pinkCyan)" stroke-width="1" stroke-opacity="0.15" rx="8"/>

  <!-- Code brackets in background -->
  <text x="40" y="120" class="bracket">&lt;</text>
  <text x="710" y="170" class="bracket">&gt;</text>

  <!-- Geometric Abstract Shapes -->
  <circle cx="650" cy="80" r="40" fill="none" stroke="#6C63FF" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="650" cy="80" r="25" fill="none" stroke="#FF4D94" stroke-dasharray="4 4" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="650" cy="80" r="10" fill="#00E5FF" fill-opacity="0.1" class="pulse-dot"/>
  <circle cx="650" cy="80" r="3" fill="#00E5FF" filter="url(#glow)"/>

  <!-- Animated flow lines -->
  <path d="M 150 20 L 350 20 L 380 50 L 500 50" fill="none" stroke="url(#purpleCyan)" stroke-width="1.5" class="flow-line" opacity="0.6"/>
  <path d="M 650 230 L 450 230 L 420 200 L 300 200" fill="none" stroke="url(#pinkCyan)" stroke-width="1.5" class="flow-line" opacity="0.6"/>

  <!-- Tech Dots / Nodes -->
  <g opacity="0.6">
    <circle cx="100" cy="50" r="4" fill="#6C63FF" filter="url(#subtleGlow)"/>
    <circle cx="200" cy="150" r="3" fill="#FF4D94"/>
    <circle cx="500" cy="200" r="4" fill="#00E5FF" filter="url(#subtleGlow)"/>
    <circle cx="700" cy="100" r="3" fill="#6C63FF"/>
    <circle cx="300" cy="50" r="2" fill="#ffffff"/>
  </g>

  <!-- Content -->
  <!-- Tagline / Top Status -->
  <g transform="translate(80, 75)">
    <!-- Terminal prompt icon -->
    <path d="M -25 -10 L -15 -5 L -25 0" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-12" y1="0" x2="-2" y2="0" stroke="#00E5FF" stroke-width="2.5"/>
    <text x="10" y="-2" class="tag">SYSTEM.INIT() // CONNECTED</text>
  </g>

  <!-- Main Name -->
  <text x="55" y="138" class="title" filter="url(#glow)">REETI SRIVASTAVA</text>

  <!-- Subtitle -->
  <text x="58" y="180" class="subtitle">Software Engineer • Java • MERN • AI</text>

  <!-- Side accents -->
  <rect x="760" y="40" width="6" height="50" fill="#FF4D94" rx="3" filter="url(#subtleGlow)"/>
  <rect x="760" y="100" width="6" height="80" fill="#6C63FF" rx="3" filter="url(#subtleGlow)"/>
  <rect x="760" y="190" width="6" height="20" fill="#00E5FF" rx="3" filter="url(#subtleGlow)"/>
</svg>
